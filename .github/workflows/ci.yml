name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: lazytrae-plugin/packages/cli
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lazytrae-plugin/packages/cli/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Package and operational checks
        run: npm test
      - name: Publication documentation checks
        run: npm run test:publication
      - run: npm pack --dry-run --json
        name: Verify publishable package contents
