name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: lazytrae-plugin/packages/cli
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lazytrae-plugin/packages/cli/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Package and operational checks
        run: npm test
      - name: Publication documentation checks
        run: npm run test:publication
      - run: npm pack --dry-run --json
        name: Verify publishable package contents
