name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: lazytrae-plugin/packages/cli
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lazytrae-plugin/packages/cli/package-lock.json

      - run: npm ci --ignore-scripts

      - name: Validate release tag and package version
        run: test "$RELEASE_TAG" = "v$(node -p 'require("./package.json").version')"

      - name: Run full CLI verification
        run: npm run test:all

      - name: Run standalone MCP runtime tests
        run: npm test --prefix ../mcp

      - name: Run publication documentation checks
        run: npm run test:publication

      - name: Build release package
        run: |
          package_file="$(npm pack --json | node -e 'let input=""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => console.log(JSON.parse(input)[0].filename));')"
          mv "$package_file" "lazytrae-ai-${RELEASE_TAG}.tgz"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-package-${{ env.RELEASE_TAG }}
          path: lazytrae-plugin/packages/cli/lazytrae-ai-${{ env.RELEASE_TAG }}.tgz
          if-no-files-found: error

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-package-${{ env.RELEASE_TAG }}

      - name: Publish release entry and missing asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset_name="lazytrae-ai-${RELEASE_TAG}.tgz"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -Fxq "$asset_name"; then
              echo "Release $RELEASE_TAG already contains $asset_name; leaving it unchanged."
            else
              gh release upload "$RELEASE_TAG" "$asset_name"
            fi
          else
            gh release create "$RELEASE_TAG" "$asset_name" \
              --verify-tag \
              --notes-file RELEASE_NOTES.md \
              --title "LazyTrae $RELEASE_TAG"
          fi
