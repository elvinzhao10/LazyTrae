name: Scheduled compatibility

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: Node 26 on macOS
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: lazytrae-plugin/packages/cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: lazytrae-plugin/packages/cli/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run test:all
      - run: npm test --prefix ../mcp
      - run: npm run test:publication
